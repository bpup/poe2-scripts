# =============================================================================
# PoE2 Auto-Follow — Multi-Account + Local Co-op Configuration
# =============================================================================
#
# Each account is a separate PoE2 process (window). Local co-op means each
# window has up to 2 characters: Player 1 (keyboard) and Player 2 (gamepad).
#
# ── accounts ──
#   characters[x]:
#     slot:         0 = P1 (keyboard), 1 = P2 (gamepad)
#     role:         leader | follower
#     input_method: keyboard | gamepad | none (default: inferred from slot)
#                   - P1 = keyboard (PostMessage)
#                   - P2 = gamepad  (ViGEmBus virtual Xbox 360 controller)
#                   - none = monitor position only, no input injected
#
# ── 1 手柄 4 角色设置指南 ──
#
# 目标：用 1 个物理手柄 + 2 个 PoE2 窗口，操控 4 个角色（本地双人 x2）。
#
# 游戏内要求：每个窗口里 P1 是键盘，P2 是手柄（游戏设置）。
# 本工具用 ViGEmBus 给每个窗口的 P2 创建虚拟 X360 手柄，不需要 HidHide。
#
# 窗口 1（账号 main）:
#   P1 (slot 0): 键盘 · Leader — 你亲自操作
#   P2 (slot 1): 虚拟手柄 · Follower — 工具自动跟随
#
# 窗口 2（账号 alt）:
#   P1 (slot 0): 键盘 · Follower — 工具注入（技能键/血瓶可用）
#   P2 (slot 1): 虚拟手柄 · Follower — 工具自动跟随
#
# ⚠️ 已知限制：
#   - P1 的 WASD 移动通过 PostMessage 注入，但 PoE2 用 DirectInput 读取
#     移动输入，PostMessage 不生效。P1 跟随者可以放技能/喝血瓶，但无法
#     自动移动。SendInput 回退已实现但需要窗口焦点。
#
# 推荐方案（如果 P1 跟随者需要自动移动）：
#   使用 2 个物理手柄 + HidHide 分别分配给每个窗口的 P2，
#   P1 跟随者改为手动操作或用按键精灵。
#
# 登录流程：
#   1. 启动 2 个 PoE2 窗口（用 launcher.py 或手动）
#   2. 两边都进游戏 → 按手柄 A 键激活 P2 → 创建/加入 P2 角色
#   3. 确保两边都进入主城后启动本工具
#   4. GUI 选择窗口 → Start → 工具开始跟随

accounts:
  - id: main
    window_title: "Path of Exile 2"
    characters:
      - slot: 0
        role: leader
      - slot: 1
        role: follower

  - id: alt
    window_title: "Path of Exile 2"
    characters:
      - slot: 0
        role: follower
      - slot: 1
        role: follower

# ── Sampling ──
sampling:
  tick_ms: 50                     # control loop interval (ms)

runtime:
  max_follower_lag_ms: 200

# ── PoE2 memory offsets (sourced from POE2Radar/Poe2Offsets.cs) ──
nav:
  aob:
    game_states:
      bytes: "48 39 2D ?? ?? ?? ?? 0F 85 16 01 00 00"
      disp_offset: 3
      instr_len: 7

  offsets:
    game_state:
      current_state_ptr: 0x08
    in_game_state:
      area_instance: 0x290
    area_instance:
      awake_entities: 0x6D8
      local_player: 0x5B8
      terrain_metadata: 0x8B8
    terrain_metadata:
      walkable_data: 0xD0
      bytes_per_row: 0x130
    entity:
      details: 0x08
      component_list: 0x10
    entity_details:
      component_lookup: 0x28
    component_lookup:
      name_bucket: 0x28
      entry_stride: 0x10
    render_component:
      world_position: 0x138
    positioned_component:
      reaction: 0x1E0
    life_component:
      health: 0x1B0
      mana: 0x208
      energy_shield: 0x248

  world_to_grid_ratio: 10.8696
  render_component_name: "Render"
  player_component_name: "Player"

  player_component:
    name: 0x1B0
    level: 0x204

  entity_path:
    chain: [0x08, 0x00]

  portal:
    enabled: true
    entity_path_keywords:
      - "portal"
      - "townportal"
      - "areatransition"
    interact_key: "LMB"
    interact_radius: 4.0
    detection_radius: 100.0
    click_repeat_delay: 1.5

  flask:
    enabled: true
    hp_threshold: 0.50
    mana_threshold: 0.30
    flask_cooldown: 0.5
    flask_keys: ["1", "2", "3", "4", "5"]

  auto_loot:
    enabled: true
    entity_path_keywords:
      - "Metadata/Items"
    pickup_radius: 8.0
    click_delay: 0.3

  death:
    enabled: true

  behavior:
    formation:
      type: diamond
      spacing: 35.0

    anti_stuck:
      enabled: true
      distance_threshold: 2.0
      stuck_ticks: 10
      jump_key: "SPACE"
      skill_key: "Q"
      reverse_duration_ticks: 8
      reverse_cooldown_ticks: 30
