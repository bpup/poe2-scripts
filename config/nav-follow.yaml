# =============================================================================
# PoE2 Auto-Follow — Multi-Account + Local Co-op Configuration
# =============================================================================
#
# Each account is a separate PoE2 process (window). Local co-op means each
# window has up to 2 characters: Player 1 (keyboard) and Player 2 (gamepad).
#
# ── accounts ──
#   characters[x]:
#     slot:         0 = P1 (keyboard), 1 = P2 (gamepad)
#     role:         leader | follower
#     input_method: keyboard | gamepad | none (default: inferred from slot)
#                   - P1 = keyboard (PostMessage — broken for PoE2 movement)
#                   - P2 = gamepad  (ViGEmBus virtual Xbox 360 controller)
#                   - none = monitor position only, no input injected

accounts:
  - id: main
    window_title: "Path of Exile 2"
    characters:
      - slot: 0
        role: leader
      - slot: 1
        role: follower

  - id: alt
    window_title: "Path of Exile 2"
    characters:
      - slot: 0
        role: follower
      - slot: 1
        role: follower

# ── Sampling ──
sampling:
  tick_ms: 50                     # control loop interval (ms)

runtime:
  max_follower_lag_ms: 200

# ── PoE2 memory offsets (sourced from POE2Radar/Poe2Offsets.cs) ──
nav:
  aob:
    game_states:
      bytes: "48 39 2D ?? ?? ?? ?? 0F 85 16 01 00 00"
      disp_offset: 3
      instr_len: 7

  offsets:
    game_state:
      current_state_ptr: 0x08
    in_game_state:
      area_instance: 0x290
    area_instance:
      awake_entities: 0x6D8
      local_player: 0x5B8
      terrain_metadata: 0x8B8
    terrain_metadata:
      walkable_data: 0xD0
      bytes_per_row: 0x130
    entity:
      details: 0x08
      component_list: 0x10
    entity_details:
      component_lookup: 0x28
    component_lookup:
      name_bucket: 0x28
      entry_stride: 0x10
    render_component:
      world_position: 0x138
    positioned_component:
      reaction: 0x1E0
    life_component:
      health: 0x1B0
      mana: 0x208
      energy_shield: 0x248

  world_to_grid_ratio: 10.8696
  render_component_name: "Render"
  player_component_name: "Player"

  player_component:
    name: 0x1B0
    level: 0x204

  entity_path:
    chain: [0x08, 0x00]

  portal:
    enabled: true
    entity_path_keywords:
      - "portal"
      - "townportal"
      - "areatransition"
    interact_key: "LMB"
    interact_radius: 4.0
    detection_radius: 100.0
    click_repeat_delay: 1.5

  flask:
    enabled: true
    hp_threshold: 0.50
    mana_threshold: 0.30
    flask_cooldown: 0.5
    flask_keys: ["1", "2", "3", "4", "5"]

  auto_loot:
    enabled: true
    entity_path_keywords:
      - "Metadata/Items"
    pickup_radius: 8.0
    click_delay: 0.3

  death:
    enabled: true

  behavior:
    formation:
      type: diamond
      spacing: 35.0

    anti_stuck:
      enabled: true
      distance_threshold: 2.0
      stuck_ticks: 10
      jump_key: "SPACE"
      skill_key: "Q"
      reverse_duration_ticks: 8
      reverse_cooldown_ticks: 30
